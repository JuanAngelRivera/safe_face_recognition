<!DOCTYPE html>
<html>

<head>
    <title>Registrar Usuario</title>
</head>

<body>

    <h1>
        Registrar Usuario
    </h1>

    <form
        action="/register_user"
        method="POST"
        enctype="multipart/form-data"
    >

        <label>
            Nombre:
        </label>

        <input
            type="text"
            name="nombre"
            required
        >

        <br><br>

        <label>
            Imagen:
        </label>

        <input
            type="file"
            name="imagen"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Registrar
        </button>

    </form>

</body>

</html>
