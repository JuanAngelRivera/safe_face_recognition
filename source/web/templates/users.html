<!DOCTYPE html>
<html>

<head>
    <title>Usuarios</title>
</head>

<body>

    <h1>
        Usuarios Registrados
    </h1>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Autorizado</th>
        </tr>

        {% for usuario in usuarios %}

        <tr>

            <td>{{ usuario[0] }}</td>
            <td>{{ usuario[1] }}</td>
            <td>{{ usuario[2] }}</td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
